name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Node sources
        shell: bash
        run: |
          set -e
          for f in main.js preload.js update-service.js update-installer.js; do
            node --check "$f"
          done
          find scripts ui/patch core-extra -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done
          find scripts -type f -name '*.cjs' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done
          node --check scripts/prepare.mjs

      - name: Validate patch order and references
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("ui/patch").filter(f => /^\d+-.*\.js$/.test(f));
            const nums = files.map(f => parseInt(f, 10));
            if (new Set(nums).size !== nums.length) throw new Error("duplicate patch number");

            /* 只认真正的 <script src="patch/xxx.js"> 标签。
               之前用 indexOf("patch/" + f) 全文搜，正文注释里出现的
               "ui/patch/250-snapshot.js" 会先命中，导致顺序校验误报。 */
            const html = fs.readFileSync("ui/index.html", "utf8");
            const re = /<script\s+src="patch\/([^"]+\.js)"/g;
            const refs = [];
            let m;
            while ((m = re.exec(html)) !== null) refs.push(m[1]);

            const dup = refs.filter((f, i) => refs.indexOf(f) !== i);
            if (dup.length) throw new Error("duplicate reference: " + dup.join(", "));

            const ordered = [...files].sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
            if (refs.length !== ordered.length) {
              throw new Error("reference count mismatch: " + refs.length + " refs vs " + ordered.length + " files");
            }
            for (let i = 0; i < ordered.length; i++) {
              if (refs[i] !== ordered[i]) {
                throw new Error("wrong reference order: expected " + ordered[i] + " but got " + refs[i]);
              }
            }
            console.log("patches ok:", files.length);
          '
